name: Deploy to GitHub Pages (ems-dev)

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "RAZORPAY_KEY_ID=$RAZORPAY_KEY_ID" >> .env
          # GitHub Pages drops dotfiles — bundle a no-dot copy for the web.
          mkdir -p assets
          cp .env assets/env

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Static analysis
        run: dart analyze lib/

      - name: Build Web
        run: flutter build web --release --base-href=/ems-dev/
        if: success()

      - name: Configure Security Headers
        run: |
          python3 - <<'PYEOF'
          import re
          path = "build/web/index.html"
          with open(path, encoding="utf-8") as f:
              html = f.read()

          metas = "\n".join([
            '<meta http-equiv="Content-Security-Policy" content="default-src \'self\'; script-src \'self\' \'wasm-unsafe-eval\' https://www.gstatic.com; style-src \'self\' \'unsafe-inline\' https://fonts.googleapis.com; img-src \'self\' data: https:; font-src \'self\' https://fonts.gstatic.com; connect-src \'self\' https://*.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; worker-src \'self\' blob:; frame-ancestors \'none\'; base-uri \'self\'; form-action \'self\'">',
            '<meta http-equiv="X-Content-Type-Options" content="nosniff">',
            '<meta http-equiv="X-Frame-Options" content="DENY">',
            '<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">',
            '<meta http-equiv="Permissions-Policy" content="geolocation=(); microphone=(); camera=(); payment=(); usb=();">',
          ])

          if "<head>" in html:
              html = html.replace("<head>", "<head>\n" + metas, 1)
          elif "<html" in html:
              html = re.sub(r"(<html[^>]*>)", r"\1\n<head>\n" + metas + "\n</head>", html, count=1)
          else:
              raise SystemExit("ERROR: no <head> or <html> found in index.html")

          with open(path, "w", encoding="utf-8") as f:
              f.write(html)
          print("Security meta tags injected into <head>")
          PYEOF
        if: success()

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: success()
